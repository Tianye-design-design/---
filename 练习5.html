<!DOCTYPE html>
<html lang="en"dir="ltr">
<head>
 <meta charset="UTF-8">
 <title>CSS position Exercise</title>
 <style type="text/css">
    .container {
        border: orange solid;
        position: relative;
    .box1 {
        width: 100px;
        height: 100px;
        background: blue;
    }
    .box2 {
        width: 100px;
        height: 100px;
        background: green;
        border:yellow solid ;
        position: absolute;
        top: 50px;
        left:50px;
    }
    .box3 {
        width: 100px;
        height: 100px;
        background: red;
    }
    .box4 {
        width: 100px;
        height: 100px;
        background: pink;
    }
</style>
</head>
<body>
    <div class="container">
    <div class="box1"></div>
    <div class="box2"></div>
    <div class="box3"></div>
    <div class="box4"></div>
    </div>
</body>
</html>
